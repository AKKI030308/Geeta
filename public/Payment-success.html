<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Processing…</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:#0b0d12;border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:32px 24px;text-align:center}
.spinner{width:42px;height:42px;margin:0 auto 20px;border:3px solid rgba(255,255,255,.15);border-top-color:#3ddc97;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:23px;margin:0 0 8px}
p{margin:0;color:rgba(255,255,255,.6);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="spinner"></div>
    <h1>Payment confirmed</h1>
    <p>Opening Telegram…</p>
  </div>
</div>

<script>
(async function () {
  const orderId = new URLSearchParams(location.search).get("order_id");

  if (!orderId) {
    document.querySelector("h1").textContent = "Unable to verify payment";
    document.querySelector("p").textContent = "Please contact support.";
    return;
  }

  try {
    const response = await fetch(
      "/api/verify-payment?order_id=" + encodeURIComponent(orderId),
      { cache: "no-store" }
    );

    const data = await response.json();

    if (data.paid && data.telegram_url) {
      /*
       * Direct navigation to t.me:
       * - On phones with Telegram installed, the OS normally hands the
       *   link to the Telegram app.
       * - Otherwise Telegram's web/browser page opens.
       *
       * No Telegram invite URL is displayed as a clickable button.
       */
      window.location.replace(data.telegram_url);
      return;
    }

    document.querySelector("h1").textContent = "Payment is being confirmed";
    document.querySelector("p").textContent =
      "Please wait a few seconds and refresh this page.";
  } catch (error) {
    console.error(error);
    document.querySelector("h1").textContent = "Verification error";
    document.querySelector("p").textContent =
      "Please refresh this page in a few seconds.";
  }
})();
</script>
</body>
</html>
